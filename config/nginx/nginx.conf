worker_processes auto;

events {
  use epoll;
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  client_max_body_size 1G;
  gzip on;
  gzip_min_length 1024;
  gzip_buffers 64 16k;
  gzip_comp_level 5;
  gzip_types text/plain text/xml text/css application/json;
  gzip_vary on;
  gzip_proxied any;

  server_tokens off;
  ssl_protocols TLSv1.2 TLSv1.3;

  upstream api-server {
    server localhost:8080;
  }

  upstream minio-api {
    server 127.0.0.1:51234;
  }

  upstream minio-ui {
    server 127.0.0.1:51235;
  }

  # Map for WebSocket upgrade handling (MinIO UI)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ================================
  # HTTP -> HTTPS redirect (both domains)
  # ================================
  server {
    listen 80;
    server_name mars-pli.kro.kr minio.mars-pli.kro.kr;

    location /.well-known/acme-challenge/ {
      alias /var/www/letsencrypt/;
    }

    location / {
      return 301 https://$host:26443$request_uri;
      expires epoch;
    }
  }

  # ================================
  # API SSL (Spring Boot) - mars-pli.kro.kr
  # ================================
  server {
    listen 443 ssl;
    server_name mars-pli.kro.kr;

    ssl_certificate     /etc/letsencrypt/live/mars-pli.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mars-pli.kro.kr/privkey.pem;

    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header "Strict-Transport-Security" "max-age=15552000; preload";
    add_header "Cache-Control" "max-age=0, no-cache";
    add_header "Pragma" "no-cache";
    add_header "Expires" "-1";

    # Swagger UI 정적 리소스는 gzip/버퍼링 끄기 (큰 JS 파일 훼손 방지)
    location /swagger-ui/ {
      gzip off;
      proxy_buffering off;
      proxy_pass http://api-server;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Accept-Encoding "";
    }

    location / {
      proxy_pass http://api-server;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Accept-Encoding "";
    }
  }

  # ================================
  # MinIO SSL - minio.mars-pli.kro.kr
  # API + UI on same port (443 -> 26443 외부)
  # ================================
  server {
    listen 443 ssl;
    server_name minio.mars-pli.kro.kr;

    ssl_certificate     /etc/letsencrypt/live/minio.mars-pli.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.mars-pli.kro.kr/privkey.pem;

    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    ignore_invalid_headers off;
    error_log /var/log/nginx/error.log warn;

    # MinIO Console (UI)
    location /minio/ui/ {
      rewrite ^/minio/ui/(.*)$ /$1 break;
      proxy_pass http://minio-ui;
      proxy_http_version 1.1;

      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-NginX-Proxy true;
      real_ip_header X-Real-IP;
    }

    # MinIO API (S3)
    location / {
      proxy_pass http://minio-api;
      proxy_http_version 1.1;

      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      chunked_transfer_encoding off;
    }
  }
}
